<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Building and Publishing a Visualization with Codex — Course Guide</title>
  <style>
    :root { color-scheme: light; --ink:#20232d; --muted:#606575; --paper:#f6f1e8; --card:#fffdf8; --line:#d9d3ca; --blue:#315bc7; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font:17px/1.65 system-ui,sans-serif; }
    main { max-width:860px; margin:0 auto; padding:64px 28px 100px; }
    article { padding:clamp(28px,6vw,64px); background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:0 20px 55px #30271918; }
    h1,h2 { font-family:Georgia,serif; font-weight:500; line-height:1.12; }
    h1 { margin-top:0; font-size:clamp(2.5rem,7vw,4.8rem); letter-spacing:-.045em; }
    h2 { margin-top:2.2em; padding-top:.5em; border-top:1px solid var(--line); font-size:1.8rem; }
    blockquote { margin:1.4em 0; padding:14px 18px; background:#edf1fb; border-left:4px solid var(--blue); border-radius:0 9px 9px 0; }
    blockquote p { margin:0; }
    code { padding:.12em .35em; background:#ece8e1; border-radius:4px; font-size:.9em; }
    pre { overflow:auto; padding:16px; color:#f7f4ed; background:var(--ink); border-radius:10px; }
    pre code { padding:0; background:none; }
    a { color:var(--blue); }
    li { margin:.35em 0; }
  </style>
</head>
<body>
  <main><article id="content">Loading guide…</article></main>
  <script>
    function inline(text) {
      return text
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    }

    function render(markdown) {
      const lines = markdown.split(/\r?\n/), output = [];
      let list = '', code = false, paragraph = [];
      const closeList = () => { if (list) { output.push(`</${list}>`); list = ''; } };
      const closeParagraph = () => { if (paragraph.length) { output.push(`<p>${inline(paragraph.join(' '))}</p>`); paragraph = []; } };
      for (const line of lines) {
        if (line.startsWith('```')) {
          closeParagraph(); closeList();
          output.push(code ? '</code></pre>' : '<pre><code>');
          code = !code; continue;
        }
        if (code) { output.push(`${inline(line)}\n`); continue; }
        if (!line.trim()) { closeParagraph(); closeList(); continue; }
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) { closeParagraph(); closeList(); const level=heading[1].length; output.push(`<h${level}>${inline(heading[2])}</h${level}>`); continue; }
        const quote = line.match(/^>\s?(.*)$/);
        if (quote) { closeParagraph(); closeList(); output.push(`<blockquote><p>${inline(quote[1])}</p></blockquote>`); continue; }
        const unordered = line.match(/^[-*]\s+(.+)$/), ordered = line.match(/^\d+\.\s+(.+)$/), item = unordered || ordered;
        if (item) { closeParagraph(); const wanted=unordered?'ul':'ol'; if(list!==wanted){closeList();list=wanted;output.push(`<${list}>`)} output.push(`<li>${inline(item[1])}</li>`); continue; }
        paragraph.push(line.trim());
      }
      closeParagraph(); closeList();
      return output.join('\n');
    }

    fetch(`CODEX_VISUALIZATION_WORKFLOW.md?v=${Date.now()}`, { cache: 'no-store' })
      .then(response => response.text())
      .then(markdown => { document.querySelector('#content').innerHTML = render(markdown); })
      .catch(() => { document.querySelector('#content').textContent = 'The guide could not be loaded.'; });
  </script>
</body>
</html>
